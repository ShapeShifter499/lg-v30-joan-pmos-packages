# LG V30 (joan) HiFi use case.
#
# joan does not use the WCD9340's analog outputs at all -- they are not wired
# to a transducer on this board.  The headphone jack is driven by an ES9218P
# "Quad DAC" fed over quaternary MI2S, so the routing below points the
# MultiMedia1 frontend at QUAT_MI2S_RX rather than at SLIMBUS_0_RX.
#
# Every control and value here is one verified working on hardware.
Syntax 3

SectionVerb {
	EnableSequence [
		# Frontend -> quaternary MI2S backend (the ES9218P).
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		# Make sure the unused SLIMbus path is not also fed.
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphone jack (ES9218P Quad DAC)"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		# Hand the sound server the DAC's own controls so the desktop
		# volume slider drives real hardware attenuation. Syntax 3 wants
		# the bare control name, as the shipped sdm845 profile does.
		PlaybackVolume "Headphone Playback Volume"
		PlaybackSwitch "Headphone Playback Switch"
	}

	EnableSequence [
		cset "name='Headphone Playback Switch' on"
		# 0 dB is full scale on this amplifier and is uncomfortably loud;
		# come up at roughly -30 dB and let the user raise it.
		cset "name='Headphone Playback Volume' 195"
	]

	DisableSequence [
		cset "name='Headphone Playback Switch' off"
	]
}
